# DSP-P3 FAZ 1 — Test Harness yapılandırması
# Production/state/baseline dosyalarına DOKUNMAZ; yalnızca tests/ altını koşar.
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --tb=short
# Repo kökünü sys.path'e ekler — production modülleri (dsp_core vb.)
# invoke biçiminden bağımsız olarak import edilebilir (python -m pytest / pytest / CI).
pythonpath = .
