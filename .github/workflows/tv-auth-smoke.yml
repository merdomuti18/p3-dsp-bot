name: TV auth smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Prove TV login + hist
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          TV_AUTH_TOKEN: ${{ secrets.TV_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          from tv_auth import UNAUTHORIZED, is_authenticated, make_tv_client, resolve_auth_token
          from tvDatafeed import Interval

          token, diag = resolve_auth_token()
          print("diag=", {k: diag.get(k) for k in (
              "ok", "source", "http_status", "error", "code",
              "has_user", "user_len", "pass_len",
          )})
          assert token, f"TV auth token missing: {diag}"

          tv, diag2 = make_tv_client(require_auth=True)
          assert is_authenticated(tv), f"still anonymous: token={tv.token!r} diag={diag2}"
          assert tv.token != UNAUTHORIZED
          print(f"auth_ok source={diag2.get('source')} token_len={len(tv.token)}")

          df = tv.get_hist("ASELS", "BIST", interval=Interval.in_daily, n_bars=5)
          assert df is not None and len(df) > 0, "empty hist"
          print(f"OK bars={len(df)} last_close={float(df['close'].iloc[-1]):.4f}")
          print(df.tail(2).to_string())
          PY
